name: Build Windows exe

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Fetch ffmpeg binary for bundling
        shell: pwsh
        run: |
          $ffmpegPath = python -c "import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())"
          Copy-Item $ffmpegPath -Destination .\ffmpeg.exe
          echo "Bundling ffmpeg from $ffmpegPath"

      - name: Build exe with PyInstaller
        run: |
          pyinstaller --onefile --windowed --name VideoMerger --add-binary "ffmpeg.exe;." video_merger.py

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: VideoMerger-windows
          path: dist/VideoMerger.exe

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/VideoMerger.exe
